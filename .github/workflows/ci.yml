name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Weekly schedule: re-runs this same CI (incl. `npm audit`) so newly
  # published advisories against the pinned package-lock.json are caught even
  # without a push. NOTE: GitHub auto-disables scheduled workflows after 60
  # days with no repository activity — a dormant repo silently stops being
  # checked. See _work/handoff-nene2-python-2026-08-12-schedule-rollout-note.md.
  schedule:
    - cron: '20 1 * * 1' # Monday 01:20 UTC = 10:20 JST

  # Manual trigger; `simulate_failure` lets us prove the failure-notification
  # path (see notify-failure below) without waiting for a real weekly failure.
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Intentionally fail check to verify the failure-notification path'
        type: boolean
        default: false

# github.event_name must be part of the group: without it, a schedule/dispatch
# run racing a push run gets cancelled by the push run instead of completing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run test:coverage

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: nene2_ci
          MYSQL_USER: nene2_ci
          MYSQL_PASSWORD: nene2_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unene2_ci -pnene2_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - name: MySQL integration tests
        env:
          NENE2_NODE_TEST_MYSQL_URL: mysql://nene2_ci:nene2_ci@127.0.0.1:3306/nene2_ci
        run: npm run test:integration -- tests/integration/mysql-integration.test.ts
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nene2_ci
          POSTGRES_PASSWORD: nene2_ci
          POSTGRES_DB: nene2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nene2_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - name: PostgreSQL integration tests
        env:
          NENE2_NODE_TEST_POSTGRES_URL: postgresql://nene2_ci:nene2_ci@127.0.0.1:5432/nene2_ci
        run: npm run test:integration -- tests/integration/postgres-integration.test.ts

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - name: Redis integration tests
        env:
          NENE2_NODE_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:integration -- tests/integration/redis-integration.test.ts

  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit tags without a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-safety.mjs

  notify-failure:
    name: Open an issue when the scheduled run fails
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [check, mysql-integration, postgres-integration, redis-integration, release-safety]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 nene2-node: 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          body="週次の schedule 実行が失敗しました。 実行: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
