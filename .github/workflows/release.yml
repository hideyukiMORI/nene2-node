# Publishes to npm via OIDC Trusted Publisher (no NPM_TOKEN secret).
# npm package settings must list: hideyukiMORI/nene2-node · workflow release.yml
#
# Before creating a GitHub Release:
# 1. Bump version in package.json + CHANGELOG on main
# 2. Tag must match package version (e.g. tag v0.1.1 → "version": "0.1.1")

name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Activate npm 11 for OIDC trusted publishing
        run: corepack enable && corepack prepare npm@11.6.2 --activate && npm --version

      - name: Verify tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npx npm@11.6.2 publish --provenance --access public
